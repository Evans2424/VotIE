# Cross-Municipality Experiment: Test on Covilhã
# Train on 5 municipalities, test on Covilhã (held-out)
# LOMO (Leave-One-Municipality-Out) split

model:
  name: "bert_crf"
  model_name: "neuralmind/bert-base-portuguese-cased"
  architecture: "crf"
  dropout: 0.1
  num_labels: null  # will be set automatically

data:
  data_dir: "data/votie_lomo/M03_covilha"
  train_file: "train.jsonl"
  dev_file: "dev.jsonl"
  test_file: "test.jsonl"

training:
  batch_size: 16
  epochs: 10
  learning_rate: 2e-5
  warmup_proportion: 0.1
  weight_decay: 0.01
  patience: 3
  device: 0  # CUDA device ID
  apply_bio_validation: true

optimization:
  optimizer: "adamw"
  scheduler: "linear_with_warmup"
  grad_clip: 1.0

augmentation:
  max_length: 512
  padding: "max_length"
  truncation: true

windowing:
  enable_windowing: true
  overlap_tokens: 50
