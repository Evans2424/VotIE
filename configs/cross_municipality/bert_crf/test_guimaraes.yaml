# Cross-Municipality Experiment: Test on Guimarães
# Train on 5 municipalities, test on Guimarães (held-out)

model:
  name: "bert_crf_cross_muni_guimaraes"
  model_name: "neuralmind/bert-base-portuguese-cased"
  architecture: "crf"
  dropout: 0.1
  num_labels: null  # will be set automatically

data:
  data_dir: "data/publication_datasets/ner_datasets/pt/cross_municipality/test_guimaraes"
  train_files: ["train.jsonl"]
  dev_file: "dev.jsonl"
  test_file: "test.jsonl"

training:
  batch_size: 16
  epochs: 5
  learning_rate: 2e-5
  warmup_proportion: 0.1
  weight_decay: 0.01
  patience: 3
  device: 0  # CUDA device ID
  apply_bio_validation: false

optimization:
  optimizer: "adamw"
  scheduler: "linear_with_warmup"
  grad_clip: 1.0

augmentation:
  max_length: 512
  padding: "max_length"
  truncation: true

windowing:
  enable_windowing: true
  overlap_tokens: 50
