# Cross-Municipality Experiment: Test on Campomaior
# Train on 5 municipalities, test on Campomaior (held-out)

model:
  name: "deberta_crf_cross_muni_campomaior"
  model_name: "microsoft/deberta-v3-base"
  architecture: "crf"
  dropout: 0.1
  num_labels: null  # will be set automatically

data:
  data_dir: "data/publication_datasets/ner_datasets/pt/cross_municipality/test_campomaior"
  train_files: ["train.jsonl"]
  dev_file: "dev.jsonl"
  test_file: "test.jsonl"

training:
  batch_size: 16
  epochs: 7
  learning_rate: 5e-5
  warmup_proportion: 0.1
  weight_decay: 0.01
  patience: 3
  device: 0  # CUDA device ID
  apply_bio_validation: true

optimization:
  optimizer: "adamw"
  scheduler: "linear_with_warmup"
  grad_clip: 1.0

augmentation:
  max_length: 512
  padding: "max_length"
  truncation: true

windowing:
  enable_windowing: true
  overlap_tokens: 50
